<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eman Educational Complex · Class Portraits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

<body>
    <header class="site-header" role="banner">
        <div class="container">
            <div class="header-content">
                <div class="header-brand">
                    <div class="logo-placeholder" aria-hidden="true">
                        <span class="logo-icon">◆</span>
                        <span class="logo-text">Eman</span>
                    </div>
                    <h1 class="header-title">
                        <span class="title-main">Eman</span>
                        <span class="title-sub">Educational Complex</span>
                    </h1>
                </div>
                <div class="header-tagline">
                    <p class="tagline">The people of our class</p>
                    <div class="tagline-accent"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="site-main" role="main">
        <div class="container">
            <div class="gallery-intro">
                <p class="gallery-hint">Tap a portrait to discover the story</p>
            </div>
            <div class="student-grid" id="studentGrid" role="list"></div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <div class="footer-content">
                <p class="footer-copy">&copy; 2026 Made by Faisal Yousaf, the student of Eman Educational Complex</p>
